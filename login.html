<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — Crash Number Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            dark: { 800: '#1e1e2e', 900: '#11111b', 950: '#0b0b12' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0b0b12 0%, #1a1a2e 100%); min-height: 100vh; }
    .glass { background: rgba(30, 30, 46, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .btn-primary:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .input-field { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
    .input-field:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
  </style>
</head>
<body class="text-gray-100 font-sans flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl btn-primary flex items-center justify-center font-bold text-xl">C</div>
        <span class="text-2xl font-bold">Crash <span class="text-indigo-400">Number Bot</span></span>
      </a>
    </div>

    <div class="glass rounded-3xl p-8 shadow-2xl">
      <h1 class="text-2xl font-bold text-center mb-2">Xoş gəlmisiniz</h1>
      <p class="text-gray-400 text-center text-sm mb-8">Hesabınıza daxil olun</p>

      <div id="error" class="hidden mb-4 text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Email və ya İstifadəçi adı</label>
          <div class="relative">
            <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            <input id="login" type="text" required placeholder="email@nümunə.az"
              class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm transition">
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Şifrə</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            <input id="password" type="password" required placeholder="••••••••"
              class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm transition">
          </div>
        </div>

        <button type="submit" id="btn" class="btn-primary w-full py-3.5 rounded-xl font-semibold text-sm shadow-lg shadow-indigo-500/20 transition">
          <i class="fas fa-sign-in-alt mr-2"></i> Giriş et
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-400">
        Hesabınız yoxdur?
        <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-medium">Qeydiyyatdan keçin</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      err.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Gözləyin...";
      try {
        await KingAPI.login(
          document.getElementById("login").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "dashboard.html";
      } catch (ex) {
        err.textContent = ex.message || "Giriş alınmadı";
        err.classList.remove("hidden");
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Giriş et';
      }
    });
  </script>
</body>
</html>
